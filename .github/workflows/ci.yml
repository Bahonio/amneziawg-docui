name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate shell scripts
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: Verify distribution licensing and notices
        run: sh scripts/check-licenses.sh
      - name: Prove installer VPN isolation
        run: make test-installer-safety
      - name: Exercise fresh, adopt and update installers in disposable hosts
        run: make test-installer-sandbox
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: make build
      - name: Verify removed container privileges and userspace runtime
        run: |
          ! grep -R -n -E 'amneziawg-go|/dev/net/tun|SYS_MODULE|NET_ADMIN|privileged:[[:space:]]*true' Dockerfile docker-compose*.yml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build management image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: awg-docui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify minimal unprivileged image contents
        run: |
          test "$(docker image inspect awg-docui:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect awg-docui:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/Bahonio/awg-docui'
          test "$(docker image inspect awg-docui:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = 'AGPL-3.0-or-later'
          container_id=$(docker create awg-docui:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker export "$container_id" > rootfs.tar
          tar -tf rootfs.tar > rootfs-files.txt
          grep -Fxq 'usr/local/bin/awg-docui' rootfs-files.txt
          grep -Fxq 'app/licenses/LICENSE' rootfs-files.txt
          grep -Fxq 'app/licenses/NOTICE' rootfs-files.txt
          grep -Fxq 'app/licenses/THIRD_PARTY_NOTICES.txt' rootfs-files.txt
          grep -Fxq 'app/licenses/LICENSES/Apache-2.0.txt' rootfs-files.txt
          grep -Fxq 'app/licenses/LICENSES/MPL-2.0.txt' rootfs-files.txt
          grep -Fxq 'etc/ssl/certs/ca-certificates.crt' rootfs-files.txt
          ! grep -Eq '^(bin/|lib/|sbin/|usr/bin/|usr/sbin/|var/lib/apk/)' rootfs-files.txt

  first-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create and publish the first release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          tag_sha=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
          if [ -z "$tag_sha" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          elif [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "$RELEASE_TAG already belongs to an earlier commit; this push is not the first release."
            exit 0
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published."
            exit 0
          fi
          # A tag pushed with GITHUB_TOKEN does not trigger another workflow.
          # workflow_dispatch does, so launch the existing release workflow at the tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
